<head>

<style id="v5">
/* ---------- v5: seguridad y privacidad ---------- */
.sec-rows{display:grid}
.sec-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.sec-row:first-child{border-top:0;padding-top:2px}
.sec-info{display:grid;gap:2px;min-width:0}
.sec-t{font-weight:700;line-height:1.3}
.sec-s{font-size:12.5px;color:var(--muted);line-height:1.35}
.sec-b{display:flex;justify-content:flex-end}
.sec-sel{width:auto;min-width:8.5rem}
@media (max-width:420px){.sec-row{grid-template-columns:minmax(0,1fr)}.sec-b{justify-content:flex-start}}
.sec-list{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;line-height:1.45}
.sec-code{font-family:var(--f-mono);font-size:17px;font-weight:600;letter-spacing:.04em;line-height:1.6;background:var(--surface);border:1px dashed var(--accent);border-radius:var(--r-sm);padding:12px 14px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.sec-qr{display:block;width:180px;height:180px;background:#fff;padding:8px;border-radius:var(--r-sm);border:1px solid var(--line)}
.sec-secret{font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.sec-form{display:grid;gap:12px}
.sec-busy{font-weight:600;color:var(--accent)}
#sec-gate .auth-box .row{margin-top:2px}
#sec-gate .btn[type=submit],#sec-gate #sg-done{width:100%}
#card-sec .banner{margin:4px 0 8px}
/* frase del día, arriba de la pantalla Hoy */
.quote-hoy{margin:2px 0 14px;padding:16px 18px;border-radius:var(--r-md);background:var(--surface);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface));border:1px solid var(--line);border-left:3px solid var(--accent)}
.quote-hoy .q-t{font-style:italic;font-weight:560;font-size:16px;line-height:1.45;margin:0 0 7px;text-wrap:balance}
.quote-hoy .q-a{font-family:var(--f-mono);font-size:12px;letter-spacing:.03em;color:var(--accent);font-weight:600;margin:0;text-transform:uppercase}
.quote-hoy .q-a::before{content:'— '}
</style>
<style id="v6">
/* ---------- v6: gamificación y ajustes ---------- */
:root{--g-gold:#c9a227}
:root[data-theme="dark"],:root.dark{--g-gold:#e3c45c}
.game .g-top{display:flex;align-items:center;gap:12px}
.g-badge{width:54px;height:54px;border-radius:14px;flex:none;display:grid;place-items:center;text-align:center;line-height:1;
  color:#241f0e;background:linear-gradient(145deg,color-mix(in srgb,var(--rc,#c9a227) 55%,#fff),var(--rc,#c9a227));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 6px 14px -8px var(--rc,#c9a227)}
.g-ic{font-size:18px;display:block;margin-top:5px}
.g-badge small{display:block;font-family:var(--f-display);font-weight:800;font-size:8.5px;letter-spacing:.04em;margin-top:2px;padding-bottom:4px}
.g-meta{flex:1;min-width:0}
.g-rank{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1}
.g-sub{color:var(--muted);font-size:12.5px;font-family:var(--f-mono);margin-top:2px}
.g-today{flex:none;align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:3px 8px;border-radius:999px}
.g-xprow{display:flex;justify-content:space-between;margin:14px 0 6px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.g-bar{height:12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);overflow:hidden}
.g-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#fff));transition:width .6s cubic-bezier(.2,.7,.2,1)}
.g-hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.g-streak{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.g-flame{font-size:22px}
.g-stxt b{font-family:var(--f-display);font-weight:800;font-size:17px;display:block;line-height:1.1}
.g-stxt small{font-size:11.5px;color:var(--muted)}
.g-shields{margin-left:auto;display:flex;gap:4px}
.g-sh{font-size:15px;filter:grayscale(1);opacity:.35}
.g-sh.on{filter:none;opacity:1}
.g-decay{margin:12px 0 0;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:var(--r-sm);padding:9px 11px}

/* logros */
#card-ach .ach{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
#card-ach .ach:first-of-type{border-top:0;padding-top:4px}
.ach-ic{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ach-ic.gold{background:color-mix(in srgb,var(--g-gold) 22%,transparent)}
.ach-b{min-width:0;flex:1}
.ach-v{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.15}
.ach-l{font-size:12.5px;color:var(--muted)}
.ach-tag{flex:none;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:4px 8px;border-radius:999px}

/* fila de ajuste con switch */
.setrow{display:flex;align-items:center;gap:12px}
.setrow-i{min-width:0;flex:1}
.setrow-i b{display:block;font-weight:700}
.setrow-i span{font-size:12.5px;color:var(--muted);line-height:1.35}
</style>
<style id="v7">
/* ---------- v7: jefes finales ---------- */
:root{--boss:#b5432f}
:root[data-theme="dark"],:root.dark{--boss:#e0624a}
.bosses{display:grid;gap:9px;margin-bottom:12px}
.bosscard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;cursor:pointer}
.bosscard.won{border-color:var(--g-gold)}
.bc-ic{font-size:26px;flex:none}
.bc-b{flex:1;min-width:0;display:grid;gap:4px}
.bc-n{font-family:var(--f-display);font-weight:750;font-size:15px}
.bc-s{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.bc-bar{height:7px;border-radius:999px;background:color-mix(in srgb,var(--boss) 16%,transparent);overflow:hidden;margin-top:2px}
.bc-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#fff))}
.bc-win{font-size:20px;flex:none}

.boss-reward{font-size:13px;color:var(--muted);margin:2px 0 14px}
.hp-row{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11.5px;margin:0 0 5px}
.hp-l{color:var(--boss);font-weight:600}.hp-r{color:var(--muted)}
.hpbar{height:13px;border-radius:999px;background:color-mix(in srgb,var(--boss) 16%,transparent);overflow:hidden}
.hpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--boss) 80%,#000 0%),var(--boss));transition:width .5s}
.boss-won{margin:12px 0 0;font-weight:700;color:var(--g-gold);text-align:center}
.bstages{margin-top:16px;display:grid;gap:11px}
.bstage{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px}
.bstage.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 7%,transparent)}
.bstage.act{border-color:var(--g-gold)}
.bst-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.bst-n{font-family:var(--f-display);font-weight:700;font-size:14px}
.bst-mk{font-size:14px}
.bitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 0;cursor:pointer;font-size:14px;color:var(--ink)}
.bchk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.bitem.done .bchk.on{background:var(--accent);border-color:var(--accent)}
.bitem.done span:last-child{color:var(--muted);text-decoration:line-through}

/* editor */
.bedit-stage{border:1px solid var(--line);border-radius:var(--r-md);padding:10px;margin:8px 0;display:grid;gap:7px}
.bedit-sth{display:flex;gap:7px;align-items:center}
.bedit-stname{flex:1;font-weight:600}
.bedit-item{display:flex;gap:7px;align-items:center}
.bedit-item input{flex:1}
.iconbtn{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}
.iconopt{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:19px;cursor:pointer}
.iconopt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
</style>
<style id="v8">
/* ---------- v8: amigos y ranking ---------- */
#card-social .soc-me{margin:2px 0 10px}
.soc-u{font-family:var(--f-display);font-weight:800;font-size:19px}
.soc-code{background:var(--app,var(--surface));border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:0 0 12px}
.soc-code-l{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.soc-code-v{display:flex;align-items:center;gap:10px}
.soc-code-v code{font-family:var(--f-mono);font-weight:700;font-size:20px;letter-spacing:.14em;flex:1;user-select:all;-webkit-user-select:all}
#card-social .switch{margin:0 0 12px}
.soc-add .amt-row{display:flex;gap:8px}
.soc-add .amt-row input{flex:1}
.consent.sm{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--muted);margin:2px 0 12px;line-height:1.4}
.consent.sm input{margin-top:2px}

/* tabla de ranking */
#card-rank .segc{margin:4px 0 12px}
.lb{display:grid;gap:3px}
.lb-row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px}
.lb-row.me{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.lb-pos{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--muted);width:24px;text-align:center;flex:none}
.soc-badge{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:14px;background:color-mix(in srgb,var(--rc,#888) 24%,transparent)}
.lb-name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name small{color:var(--muted);font-weight:500}
.lb-xp{flex:none;font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--accent)}
</style>
<style id="v9">
/* ---------- v9: retos sociales ---------- */
.reto .reto-t{font-size:16px;line-height:1.45;font-weight:600;margin:4px 0 12px;text-wrap:balance}
.reto .reto-t.isdone{color:var(--muted);font-weight:500}
.reto-acts{display:flex;gap:9px}
.reto-acts .btn{flex:1}
.reto-acts .btn.sm{flex:0 0 auto}
.reto-ask{font-size:13px;color:var(--muted);margin:2px 0 8px}
.reto-moods{display:flex;gap:8px}
.reto-mood{flex:1;font-size:24px;line-height:1;padding:10px 0;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;transition:transform .1s}
.reto-mood:active{transform:scale(.92)}
.reto-note{font-size:13px;color:var(--accent);font-weight:600;margin:2px 0 0}
/* selector de nivel en la hoja */
.reto-lv{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin:8px 0;background:var(--surface);cursor:pointer}
.reto-lv.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.reto-lv b{display:block;font-family:var(--f-display);font-weight:750;font-size:15px}
.reto-lv span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
</style>
<style id="v11">
/* ---------- v11: Competencia / clanes ---------- */
.club-card{padding:0;overflow:hidden}
.club-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:15px 16px;cursor:pointer;font:inherit;color:inherit}
.club-nm{font-family:var(--f-display);font-weight:750;font-size:15.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.club-caret{color:var(--muted);font-size:13px;width:14px;text-align:center}
.club-st{font-weight:650}
.club-st.live{color:var(--accent)}
.club-st.soon{color:var(--muted)}
.club-st.ended{color:var(--muted);text-decoration:line-through}
.club-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.club-codeline{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.club-codeline>span{font-size:12.5px;color:var(--muted)}
.club-lb{margin:4px 0 2px}
.club-adm{font-size:10.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 6px;vertical-align:middle}
.club-mctrl{display:flex;gap:6px;flex-basis:100%;margin:6px 0 2px;padding-left:34px}
.btn.xs{font-size:12px;padding:5px 9px;border-radius:var(--r-sm)}
.btn.danger{color:#fff;background:var(--danger,#d4453b);border-color:transparent}
.btn.xs.danger{background:var(--danger,#d4453b)}
.club-acts{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.club-edit{margin:12px 0 2px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.club-edit .amt-row{gap:10px}
.lb-row{flex-wrap:wrap}
</style>
</head>
<body>

<div id="splash" class="splash"><div class="auth-brand"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18l7-7 7 7" style="stroke:var(--accent)"/><path d="M7.5 12.5L12 8l4.5 4.5" style="stroke:var(--accent);opacity:.55"/></svg><span>Ascend</span></div></div>

<div id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18l7-7 7 7" style="stroke:var(--accent)"/><path d="M7.5 12.5L12 8l4.5 4.5" style="stroke:var(--accent);opacity:.55"/></svg><span>Ascend</span></div>
    <p class="auth-tag">Tu plan diario de comida y calorías, ejercicio, hábitos, recordatorios, medicamentos y sueño, guardado en tu cuenta.</p>
    <div class="auth-box">
      <div class="auth-tabs" id="auth-tabs" role="tablist" aria-label="Acceso">
        <button type="button" role="tab" id="auth-tab-in" data-mode="in" aria-selected="true">Entrar</button>
        <button type="button" role="tab" id="auth-tab-up" data-mode="up" aria-selected="false">Crear cuenta</button>
      </div>
      <h1 class="auth-h" id="auth-h" hidden></h1>
      <form id="auth-form" novalidate>
        <div class="field" id="auth-email-f"><label class="lbl" for="auth-email">Correo</label><input type="email" id="auth-email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"></div>
        <div class="field" id="auth-pass-f"><label class="lbl" for="auth-pass" id="auth-pass-lbl">Contraseña</label><input type="password" id="auth-pass" autocomplete="current-password" maxlength="128"></div>
        <label class="consent" id="auth-consent-f" hidden><input type="checkbox" id="auth-consent"><span>Acepto la <a href="/privacidad" target="_blank" rel="noopener">política de privacidad</a> y doy mi consentimiento explícito para que Ascend guarde y use mis datos de salud en mi cuenta.</span></label>
        <p class="form-err" id="auth-err" role="alert"></p>
        <p class="auth-ok" id="auth-ok" role="status"></p>
        <button type="submit" class="btn" id="auth-go">Entrar</button>
      </form>
      <button type="button" class="link" id="auth-forgot">Olvidé mi contraseña</button>
    </div>
    <p class="auth-note">Tus registros viajan y se guardan cifrados, y solo tú los ves. <a href="/privacidad" target="_blank" rel="noopener">Privacidad</a></p>
    <details class="privacy" id="auth-privacy"></details>
  </div>
</div>

<div id="app" hidden>
<header class="bar">
  <div class="bar-in">
    <span class="brand"><svg class="mark" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18l7-7 7 7" style="stroke:var(--accent)"/><path d="M7.5 12.5L12 8l4.5 4.5" style="stroke:var(--accent);opacity:.55"/></svg>Ascend</span>
    <span id="save" class="save" data-s="loading" role="status" aria-live="polite">Cargando…</span>
  </div>
</header>

<main id="main">
  <div class="view" id="view-hoy" data-view="hoy">
    <section class="card"><div class="card-h"><h2>Hoy</h2></div><p class="empty">Cargando tu plan del día: medicamentos, agua, comidas y sueño.</p></section>
  </div>
  <div class="view" id="view-progreso" data-view="progreso" hidden></div>
  <div class="view" id="view-habitos" data-view="habitos" hidden></div>
  <div class="view" id="view-salud" data-view="salud" hidden></div>
  <div class="view" id="view-guia" data-view="guia" hidden></div>
  <div class="view" id="view-club" data-view="club" hidden></div>
  <div class="view" id="view-ajustes" data-view="ajustes" hidden></div>
</main>

<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="sheet-close"></div><div class="sheet-card" id="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-t"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <button type="button" class="tab" id="tab-hoy" data-tab="hoy" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(-40 12 12)"><rect x="3" y="8.5" width="18" height="7" rx="3.5" fill="none"/><path d="M12 8.5v7"/></g></svg><span>Hoy</span></button>
    <button type="button" class="tab" id="tab-progreso" data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"/><path d="M7.5 15l3.5-4 3 2.5 5-6.5"/></svg><span>Progreso</span></button>
