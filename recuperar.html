<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recuperar datos · Ascend</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0c0f0e; color: #e8efe9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; line-height: 1.5; padding: 24px 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8fa397; font-size: 14px; margin: 0 0 20px; }
  .box { border-radius: 14px; padding: 16px; font-size: 16px; background: #151a18; border: 1px solid #243029; margin-bottom: 12px; }
  .box.ok { background: #10241a; border-color: #2f7d55; }
  .box.err { background: #241414; border-color: #7d3030; }
  #detalle { color: #b9c7bd; font-size: 14px; margin-bottom: 16px; }
  .btn { display: inline-block; background: #37d08a; color: #06130d; font-weight: 700; text-decoration: none; padding: 14px 20px; border-radius: 12px; font-size: 16px; }
  .hint { color: #8fa397; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Recuperación de datos de Ascend</h1>
  <p class="sub">Esta página busca la llave de cifrado guardada en este navegador y, si es la correcta, descifra tus registros.</p>
  <div id="estado" class="box">Cargando…</div>
  <div id="detalle"></div>
  <div id="acciones"></div>
</div>
<script src="/recuperar-data.js"></script>
<script src="/recuperar.js"></script>
</body>
</html>
